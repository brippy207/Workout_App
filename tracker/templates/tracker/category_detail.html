{% extends "base.html" %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'tracker/css/grid_layout.css' %}">
{% endblock %}

{% block content %}
    <h2 style="margin-top: 30px;">{{ category_name|title }}</h2>
    
    <div class="grid-container">
        {% for item in sub_categories %}
            <a href="{% url 'workout_setup' item %}" class="category-box">
                {{ item }}
            </a>
        {% endfor %}
    </div>
{% endblock %}
