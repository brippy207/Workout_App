{% extends "base.html" %}
{% block content %}

<style>
    .builder-shell {
        max-width: 820px;
        margin: 30px auto;
        padding: 20px;
    }

    .builder-panel {
        background: rgba(255, 255, 255, 0.15);
        border: 2px solid rgba(155, 41, 21, 0.3);
        border-radius: 24px;
        box-shadow: 10px 10px 0 var(--mustard);
        padding: 24px;
    }

    .exercise-card {
        background: var(--soft-white);
        border: 2px solid var(--wood);
        border-radius: 20px;
        padding: 18px;
        margin-bottom: 18px;
    }

    .exercise-card input {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        margin-bottom: 12px;
        border-radius: 12px;
        border: 2px solid var(--wood);
        box-sizing: border-box;
    }

    .round-btn {
        border: 2px solid var(--wood);
        background: var(--soft-white);
        color: var(--wood);
        font-weight: 700;
        cursor: pointer;
        box-shadow: 6px 6px 0 var(--mustard);
    }

    .plus-btn {
        width: 74px;
        height: 74px;
        padding: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.6rem;
        line-height: 1;
    }

    .save-btn {
        border: 2px solid var(--wood);
        background: var(--soft-white);
        color: var(--wood);
        border-radius: 999px;
        padding: 12px 22px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 6px 6px 0 var(--mustard);
    }
</style>

<div class="builder-shell">
    <div class="builder-panel">
        <h2 style="text-align:center;">Make Your Workout</h2>

        <form method="POST">
            {% csrf_token %}

            <label style="font-weight:700;">Workout Title</label>
            <input type="text" name="workout_name" required
                style="width:100%; padding:12px; margin:10px 0 20px; border-radius:12px; border:2px solid var(--wood);">

            <div id="exercise-list"></div>

            <div style="display:flex; justify-content:center; margin: 12px 0 20px;">
                <button type="button" class="round-btn plus-btn" onclick="addExerciseCard()">+</button>
            </div>
            <div style="text-align:center;">
                <button type="submit" class="save-btn">Save</button>
            </div>
        </form>
    </div>
</div>

<script>
    function addExerciseCard(name = '', sets = '', reps = '', weight = '') {
        const list = document.getElementById('exercise-list');
        const wrapper = document.createElement('div');
        wrapper.className = 'exercise-card';
        wrapper.innerHTML = `
      <label style="font-weight:700;">Exercise Name</label>
      <input type="text" name="exercise_name[]" value="${name}" required>

      <label style="font-weight:700;">Number of Sets</label>
      <input type="number" min="1" name="sets[]" value="${sets}" required>

      <label style="font-weight:700;">Number of Reps</label>
      <input type="number" min="1" name="reps[]" value="${reps}" required>

      <label style="font-weight:700;">Weight</label>
      <input type="number" min="0" step="0.1" name="weight[]" value="${weight}" required>
    `;
        list.appendChild(wrapper);
    }

    document.addEventListener('DOMContentLoaded', function () {
        addExerciseCard();
    });
</script>

{% endblock %}
