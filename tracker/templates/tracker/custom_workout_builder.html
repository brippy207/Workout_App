{% extends "base.html" %}
{% block content %}

<style>
  .builder-shell {
    max-width: 980px;
    margin: 40px auto 80px;
    padding: 0 24px;
    color: var(--wood);
  }

  .builder-panel {
    background: var(--cream);
    border: 4px solid var(--burnt-orange);
    border-radius: 38px;
    box-shadow: 18px 18px 0 var(--mustard);
    padding: 46px;
  }

  .builder-panel h2 {
    text-align: center;
    font-size: 2.6rem;
    margin: 0 0 10px;
  }

  .builder-panel p {
    text-align: center;
    font-size: 1.1rem;
    margin-bottom: 30px;
  }

  .builder-panel label {
    display: block;
    font-weight: 900;
    margin: 16px 0 8px;
    font-size: 1.05rem;
  }

  .builder-panel input {
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    border: 4px solid var(--wood);
    border-radius: 20px;
    background: var(--soft-white);
    color: var(--wood);
    font-weight: 800;
    font-size: 1rem;
  }

  .exercise-builder-card {
    background: var(--soft-white);
    border: 4px solid var(--wood);
    border-radius: 30px;
    box-shadow: 10px 10px 0 var(--mustard);
    padding: 28px;
    margin: 28px 0;
  }

  .builder-actions {
    display: flex;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
    margin-top: 26px;
  }

  .retro-button {
    padding: 15px 28px;
    border: 4px solid var(--wood);
    border-radius: 999px;
    background: var(--soft-white);
    color: var(--wood);
    font-weight: 900;
    font-size: 1rem;
    box-shadow: 10px 10px 0 var(--mustard);
    cursor: pointer;
  }

  .retro-button.gold {
    background: var(--mustard);
  }

  .retro-button:hover {
    transform: translateY(-2px);
  }
</style>

<div class="builder-shell">
  <div class="builder-panel">
    <h2>Make Your Workout</h2>
    <p>Create a reusable workout and track progress every time you run it.</p>

    <form method="POST">
      {% csrf_token %}

      <label>Workout Title</label>
      <input type="text" name="workout_name" placeholder="Example: Brian's Chest Day" required>

      <div id="exercise-list">
        <div class="exercise-builder-card">
          <label>Exercise Name</label>
          <input type="text" name="exercise_name[]" placeholder="Example: Dumbbell Bench Press" required>

          <label>Number of Sets</label>
          <input type="number" name="sets[]" min="1" required>

          <label>Number of Reps</label>
          <input type="number" name="reps[]" min="1" required>

          <label>Weight</label>
          <input type="number" step="0.5" name="weight[]" min="0" required>
        </div>
      </div>

      <div class="builder-actions">
        <button type="button" class="retro-button" onclick="addExercise()">+ Add Exercise</button>
        <button type="submit" class="retro-button gold">Save Workout</button>
      </div>
    </form>
  </div>
</div>

<script>
function addExercise() {
  const list = document.getElementById("exercise-list");
  const card = document.createElement("div");
  card.className = "exercise-builder-card";

  card.innerHTML = `
    <label>Exercise Name</label>
    <input type="text" name="exercise_name[]" placeholder="Example: Cable Row" required>

    <label>Number of Sets</label>
    <input type="number" name="sets[]" min="1" required>

    <label>Number of Reps</label>
    <input type="number" name="reps[]" min="1" required>

    <label>Weight</label>
    <input type="number" step="0.5" name="weight[]" min="0" required>
  `;

  list.appendChild(card);
}
</script>

{% endblock %}
