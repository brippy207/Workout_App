{% extends "base.html" %}
{% block content %}

<h2>{{ workout_name|title }} Setup</h2>
<p>Choose your gym setup to load the default premade workout.</p>

<div style="max-width: 500px; margin-bottom: 30px;">
    <label for="gym-select"><strong>Gym Setup:</strong></label>
    <select id="gym-select" style="width: 100%; padding: 10px; margin-top: 10px;">
        <option value="">-- Select a setup --</option>
        {% for value, label in gym_options %}
            <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
    </select>
</div>

<div id="workout-display" style="display:none; margin-top: 30px;">
    <h3 id="workout-title"></h3>
    <p id="workout-description"></p>

    <form id="workout-form" method="post">
        {% csrf_token %}
        <div id="exercise-container"></div>
        <button type="submit" style="margin-top:20px;">Save Workout</button>
    </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const gymSelect = document.getElementById("gym-select");
    const workoutDisplay = document.getElementById("workout-display");
    const workoutTitle = document.getElementById("workout-title");
    const workoutDescription = document.getElementById("workout-description");
    const exerciseContainer = document.getElementById("exercise-container");
    const workoutForm = document.getElementById("workout-form");

    gymSelect.addEventListener("change", function () {
        const gymType = this.value;

        if (!gymType) {
            workoutDisplay.style.display = "none";
            exerciseContainer.innerHTML = "";
            return;
        }

        fetch(`/tracker/workout/{{ workout_name }}/${gymType}/data/`)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to load workout");
                }
                return response.json();
            })
            .then(data => {
                workoutDisplay.style.display = "block";
                workoutTitle.textContent = data.workout.name;
                workoutDescription.textContent = data.workout.description;
                workoutForm.action = `/tracker/workout/save/${data.workout.slug}/`;

                exerciseContainer.innerHTML = "";

                data.exercises.forEach(exercise => {
                    const prev = exercise.previous || {};

                    const card = document.createElement("div");
                    card.style.border = "1px solid #ccc";
                    card.style.padding = "20px";
                    card.style.marginBottom = "20px";
                    card.style.borderRadius = "10px";
                    card.style.backgroundColor = "#f8f8f8";

                    card.innerHTML = `
                        <h4>${exercise.order}. ${exercise.name}</h4>
                        <p><strong>Prescription:</strong> ${exercise.sets} sets of ${exercise.reps}</p>
                        <p><strong>Rest:</strong> ${exercise.rest_seconds} sec</p>
                        <p>${exercise.notes || ""}</p>

                        <div style="margin: 15px 0; padding: 10px; background: #eee; border-radius: 8px;">
                            <strong>Previous workout:</strong><br>
                            Set 1: ${prev.set_1_weight ?? "-"} x ${prev.set_1_reps ?? "-"}<br>
                            Set 2: ${prev.set_2_weight ?? "-"} x ${prev.set_2_reps ?? "-"}<br>
                            Set 3: ${prev.set_3_weight ?? "-"} x ${prev.set_3_reps ?? "-"}<br>
                            Set 4: ${prev.set_4_weight ?? "-"} x ${prev.set_4_reps ?? "-"}
                        </div>

                        <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:10px;">
                            <input type="number" step="0.5" name="exercise_${exercise.id}_set_1_weight" placeholder="Set 1 weight">
                            <input type="number" name="exercise_${exercise.id}_set_1_reps" placeholder="Set 1 reps">

                            <input type="number" step="0.5" name="exercise_${exercise.id}_set_2_weight" placeholder="Set 2 weight">
                            <input type="number" name="exercise_${exercise.id}_set_2_reps" placeholder="Set 2 reps">

                            <input type="number" step="0.5" name="exercise_${exercise.id}_set_3_weight" placeholder="Set 3 weight">
                            <input type="number" name="exercise_${exercise.id}_set_3_reps" placeholder="Set 3 reps">

                            <input type="number" step="0.5" name="exercise_${exercise.id}_set_4_weight" placeholder="Set 4 weight">
                            <input type="number" name="exercise_${exercise.id}_set_4_reps" placeholder="Set 4 reps">
                        </div>

                        <textarea
                            name="exercise_${exercise.id}_notes"
                            placeholder="Notes"
                            style="width:100%; margin-top:10px;"
                        ></textarea>
                    `;

                    exerciseContainer.appendChild(card);
                });
            })
            .catch(error => {
                console.error(error);
                workoutDisplay.style.display = "block";
                workoutTitle.textContent = "Error";
                workoutDescription.textContent = "Could not load this workout.";
                exerciseContainer.innerHTML = "";
            });
    });
});
</script>

{% endblock %}
