{% extends "base.html" %}

{% block content %}
<div class="setup-container" style="margin-top: 50px; text-align: center;">
    <h2>{{ workout_name|title }} Setup</h2>
    <p class="description">Where are you training today?</p>
    
    <form style="margin-top: 20px;">
        <select name="gym_setup" style="padding: 15px; border-radius: 10px; border: 2px solid var(--wood); font-family: 'Courier New', monospace; width: 300px;">
            <option value="" disabled selected>Pick your gym setup</option>
            <option value="no_equip">No Equipment (Bodyweight)</option>
            <option value="home_gym">Home Gym / Dumbbells</option>
            <option value="commercial">General Commercial Gym</option>
            <option value="pf">Planet Fitness</option>
            <option value="crunch">Crunch Fitness</option>
            <option value="lifetime">Life Time Fitness</option>
        </select>
        <br><br>
        <button type="submit" class="category-box" style="height: 60px; width: 200px; cursor: pointer; border: 2px solid var(--wood);">
            Start Workout
        </button>
    </form>
</div>
{% endblock %}
